name: Windows profile build

on:
  workflow_call:
    inputs:
      profile: {type: string, required: true}
      jobs: {type: number, required: true}
      minutes: {type: number, required: true}
      resume_run_id: {type: string, default: ''}
      resume_artifact_id: {type: string, default: ''}

permissions:
  contents: read
  actions: write

concurrency:
  group: thorium-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  THORIUM_CI_PROFILE: ${{ inputs.profile }}
  WORK_ROOT: 'C:\t\work'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  prepare:
    runs-on: windows-2025-vs2026
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.resume.outputs.status || 'checkpointed' }}
      artifact-id: ${{ steps.resume.outputs.artifact-id || steps.upload.outputs.artifact-id }}
      source-run-id: ${{ steps.resume.outputs.run-id || github.run_id }}
    steps:
      - name: Preserve checkout line endings and long paths
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git line endings.' }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git long paths.' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Validate request
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
          BUILD_MINUTES: ${{ inputs.minutes }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
          RESUME_ARTIFACT: ${{ inputs.resume_artifact_id }}
        run: |
          @'
          import os, sys
          sys.path.insert(0, 'infra/ci')
          from common import configuration
          _, profile = configuration()
          if profile['target_os'] != 'win':
              raise ValueError('a Windows profile is required')
          if not 1 <= int(os.environ['BUILD_JOBS']) <= 8 or not 10 <= int(os.environ['BUILD_MINUTES']) <= 240:
              raise ValueError('jobs must be 1..8, minutes 10..240')
          if bool(os.environ['RESUME_RUN']) != bool(os.environ['RESUME_ARTIFACT']):
              raise ValueError('resume requires both run ID and artifact ID')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Invalid build request.' }
      - name: Validate resume provenance
        if: inputs.resume_artifact_id != ''
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
          RESUME_ARTIFACT: ${{ inputs.resume_artifact_id }}
        run: python infra/ci/artifacts.py resume --run-id "$env:RESUME_RUN" --artifact-id "$env:RESUME_ARTIFACT"
      - name: Prepare native Windows runner
        if: inputs.resume_artifact_id == ''
        run: ./infra/ci/runner_windows.ps1
      - name: Prepare full tarball, patches and GN
        if: inputs.resume_artifact_id == ''
        run: |
          python infra/ci/prepare_windows.py --work-root "$env:WORK_ROOT" --cache 'C:\t\cache' 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/prepare.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows source preparation failed.' }
      - name: Create initial checkpoint
        if: inputs.resume_artifact_id == ''
        run: python infra/ci/checkpoint.py pack --work-root "$env:WORK_ROOT" --archive-dir "$env:RUNNER_TEMP/handoff"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: inputs.resume_artifact_id == ''
        id: upload
        with:
          name: thorium-checkpoint-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: ${{ runner.temp }}/handoff/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: thorium-prepare-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runner.json
            ${{ runner.temp }}/prepare.log
            C:/t/work/manifest.json
            C:/t/work/dependencies.json
            C:/t/work/windows-host.json
            C:/t/work/logs/
          retention-days: 7
          if-no-files-found: ignore

  stage_1:
    needs: prepare
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.prepare.outputs.status }}
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      source-run-id: ${{ needs.prepare.outputs.source-run-id }}
      ordinal: 1
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_2:
    needs: stage_1
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_1.outputs.status }}
      artifact-id: ${{ needs.stage_1.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_1.outputs.source-run-id }}
      ordinal: 2
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_3:
    needs: stage_2
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_2.outputs.status }}
      artifact-id: ${{ needs.stage_2.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_2.outputs.source-run-id }}
      ordinal: 3
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_4:
    needs: stage_3
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_3.outputs.status }}
      artifact-id: ${{ needs.stage_3.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_3.outputs.source-run-id }}
      ordinal: 4
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_5:
    needs: stage_4
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_4.outputs.status }}
      artifact-id: ${{ needs.stage_4.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_4.outputs.source-run-id }}
      ordinal: 5
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_6:
    needs: stage_5
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_5.outputs.status }}
      artifact-id: ${{ needs.stage_5.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_5.outputs.source-run-id }}
      ordinal: 6
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_7:
    needs: stage_6
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_6.outputs.status }}
      artifact-id: ${{ needs.stage_6.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_6.outputs.source-run-id }}
      ordinal: 7
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_8:
    needs: stage_7
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_7.outputs.status }}
      artifact-id: ${{ needs.stage_7.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_7.outputs.source-run-id }}
      ordinal: 8
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_9:
    needs: stage_8
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_8.outputs.status }}
      artifact-id: ${{ needs.stage_8.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_8.outputs.source-run-id }}
      ordinal: 9
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  stage_10:
    needs: stage_9
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-windows-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ inputs.profile }}
      status: ${{ needs.stage_9.outputs.status }}
      artifact-id: ${{ needs.stage_9.outputs.artifact-id }}
      source-run-id: ${{ needs.stage_9.outputs.source-run-id }}
      ordinal: 10
      jobs: ${{ inputs.jobs }}
      minutes: ${{ inputs.minutes }}

  package:
    needs: stage_10
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require both build phases to finish
        env:
          BUILD_STATUS: ${{ needs.stage_10.outputs.status }}
          ARTIFACT_ID: ${{ needs.stage_10.outputs.artifact-id }}
          SOURCE_RUN: ${{ needs.stage_10.outputs.source-run-id }}
        run: |
          if ($env:BUILD_STATUS -ne 'complete') {
            "Incomplete: $env:THORIUM_CI_PROFILE reached the 10-stage limit. Resume the same commit with run=$env:SOURCE_RUN and artifact=$env:ARTIFACT_ID. Checkpoints are retained for 2 days." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
      - name: Preserve checkout line endings and long paths
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git line endings.' }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git long paths.' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Prepare packaging tools
        run: ./infra/ci/runner_windows.ps1 -PackagingOnly
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          artifact-ids: ${{ needs.stage_10.outputs.artifact-id }}
          run-id: ${{ needs.stage_10.outputs.source-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build-inputs
          merge-multiple: true
      - name: Collect installer and portable ZIP
        run: |
          python infra/ci/collect_products.py package --inputs "$env:RUNNER_TEMP/build-inputs" --destination "$env:RUNNER_TEMP/products" --tools "$env:RUNNER_TEMP/package-tools" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/package.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - name: Upload packages and provenance
        id: products
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: thorium-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/products/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Download and manual handoff
        env:
          ARTIFACT_ID: ${{ steps.products.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.products.outputs.artifact-url }}
        run: |
          "Download: [$env:THORIUM_CI_PROFILE, artifact $env:ARTIFACT_ID]($env:ARTIFACT_URL), retained for 14 days. Includes the installer, portable ZIP, manifest and SHA256SUMS. Product tests were not run; check and publish manually." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: thorium-packaging-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package.log
          retention-days: 7
          if-no-files-found: ignore
