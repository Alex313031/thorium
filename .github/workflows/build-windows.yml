name: Build Windows
run-name: Windows ${{ inputs.profile }} · ${{ github.ref_name }} · ${{ inputs.resume_artifact_id || 'fresh tarball' }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Windows variant; all builds seven independent profiles'
        type: choice
        options: [avx, avx2, avx512, sse3, sse4, sse2, arm64, all]
        default: avx2
      parallel_profiles:
        description: 'Concurrent profile chains (1-7; default 2)'
        type: number
        default: 2
      jobs:
        description: 'Parallel compiler jobs per runner (1-8)'
        type: number
        default: 2
      minutes:
        description: 'Compile minutes per stage (10-240; default 210)'
        type: number
        default: 210
      resume_run_id:
        description: 'Optional: source run ID from the same commit; select one profile'
        type: string
        default: ''
      resume_artifact_id:
        description: 'Optional: matching checkpoint or build-inputs artifact ID; requires a run ID'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Validate request and select profiles
        id: select
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          BUILD_JOBS: ${{ inputs.jobs }}
          BUILD_MINUTES: ${{ inputs.minutes }}
          PARALLEL_PROFILES: ${{ inputs.parallel_profiles }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
          RESUME_ARTIFACT: ${{ inputs.resume_artifact_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 infra/ci/dispatch.py --platform windows --profile "$REQUESTED_PROFILE" --jobs "$BUILD_JOBS" --minutes "$BUILD_MINUTES" --parallel "$PARALLEL_PROFILES" --resume-run "$RESUME_RUN" --resume-artifact "$RESUME_ARTIFACT"

  build:
    name: ${{ matrix.profile }}
    needs: select
    strategy:
      fail-fast: false
      # Manual runs can supply numeric inputs as strings; normalize their type.
      max-parallel: ${{ fromJSON(format('{0}', inputs.parallel_profiles)) }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/build-windows-profile.yml
    permissions:
      contents: read
      actions: write
    with:
      profile: ${{ matrix.profile }}
      jobs: ${{ fromJSON(format('{0}', inputs.jobs)) }}
      minutes: ${{ fromJSON(format('{0}', inputs.minutes)) }}
      resume_run_id: ${{ inputs.resume_run_id }}
      resume_artifact_id: ${{ inputs.resume_artifact_id }}
